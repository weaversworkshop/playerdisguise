plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

base {
    archivesName = project.archives_base_name
}
group = project.maven_group

String modVer = project.properties["mod_version"] ?: "indev"
version = "%s+%s.neoforge".formatted(modVer, project.properties["minecraft_version"])

sourceSets {
    main {
        java.srcDirs += project(':Core:common').sourceSets.main.java.srcDirs
        resources.srcDirs += project(':Core:common').sourceSets.main.resources.srcDirs
    }
}

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers.from file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
        }
    }

    mods {
        playerdisguise {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org/'
    }
}

processResources {
    inputs.property("version", project.version)
    filteringCharset = "UTF-8"

    HashMap modifiedSrc = new HashMap<>(project.properties)
    modifiedSrc.put("version", project.version)

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(modifiedSrc)
    }

    exclude "playerdisguise.accesswidener"
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    archiveClassifier = "release"
}
