plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

base {
    archivesName = project.archives_base_name
}
group = project.maven_group

String modVer = project.properties["mod_version"] ?: "indev"
version = "%s+%s.neoforge".formatted(modVer, project.properties["minecraft_version"])

sourceSets {
    main {
        java.srcDirs += project(':Core:common').sourceSets.main.java.srcDirs
        resources.srcDirs += project(':Core:common').sourceSets.main.resources.srcDirs
    }
}

configurations {
    devRuntimeMods
}

dependencies {
    // Dev-only mods loaded into run/* for testing. Not shipped.
    devRuntimeMods files('libs/chat_heads-0.15.1-neoforge-1.21.jar')
    compileOnly files('libs/chat_heads-0.15.1-neoforge-1.21.jar')

    // Pure-logic tests don't load the full NeoForge/Minecraft runtime — pin the transitive libs that
    // production code touches (gson, slf4j, mojang LogUtils, jetbrains annotations) directly so the
    // test JVM has them on its classpath. JUnit + testLogging come from the root build.gradle.
    testImplementation "com.google.code.gson:gson:2.10.1"
    testImplementation "org.slf4j:slf4j-simple:2.0.13"
    testImplementation "com.mojang:logging:1.2.7"
    testImplementation "org.jetbrains:annotations:24.1.0"
}

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers.from file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = file('run/client')
            programArguments.addAll '--username', 'Dev'
        }
        client2 {
            client()
            gameDirectory = file('run/client2')
            programArguments.addAll '--username', 'Dev2'
        }
        server {
            server()
            gameDirectory = file('run/server')
        }
    }

    mods {
        playerdisguise {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org/'
    }
    flatDir {
        dirs 'libs'
    }
}

processResources {
    inputs.property("version", project.version)
    filteringCharset = "UTF-8"

    HashMap modifiedSrc = new HashMap<>(project.properties)
    modifiedSrc.put("version", project.version)

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(modifiedSrc)
    }

    exclude "playerdisguise.accesswidener"
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    archiveClassifier = "release"
}

// Copy dev-only mods (chat_heads, etc.) into each run's mods/ folder so FML loads them.
def devRunDirs = ['run/client', 'run/client2', 'run/server']
def copyDevRuntimeMods = tasks.register('copyDevRuntimeMods') {
    inputs.files configurations.devRuntimeMods
    devRunDirs.each { dir -> outputs.dir("$dir/mods") }
    doLast {
        devRunDirs.each { dir ->
            copy {
                from configurations.devRuntimeMods
                into "$dir/mods"
            }
        }
    }
}
tasks.matching { it.name in ['runClient', 'runClient2', 'runServer'] }.configureEach {
    dependsOn copyDevRuntimeMods
}
