pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'playerdisguise'

include(":Core:common")
// Fabric is parked while we iterate on NeoForge — re-enable when porting.
// include(":Core:fabric")
include(":Core:neoforge")
